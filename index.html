<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>NatHaz AI Lab</title>
<link rel="canonical" href="https://lianghu.org/">
<meta property="og:url" content="https://lianghu.org/">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
:root {
  --bg: #f2f3f7; --panel: #ffffff; --panel2: #f7f8fb; --ink: #14182e; --muted: #545973; --line: #dfe2ea;
  --navy: #111633; --navy2: #2f3b70; --accent: #233575; --accent-soft: #e4e7f3; --gold: #e09600;
  --pi: #233575; --pi-soft: #e4e7f3; --lead: #1b6573; --lead-soft: #e0eef0; --bot: #6d4bb3; --bot-soft: #efe9f9;
  --rev: #9c5708; --rev-soft: #f8eedf; --dec: #1c6b43; --dec-soft: #e2f1e8; --res: #475569; --res-soft: #edf0f4;
  --sys: #5b6075; --sys-soft: #eeeff3; --code: #f1f4f2;
  --shadow: 0 1px 2px rgba(16,32,48,.05), 0 6px 20px -8px rgba(16,32,48,.12);
  --serif: "Libre Baskerville", "Noto Serif SC", "Songti SC", "Source Han Serif SC", Georgia, "Times New Roman", serif;
  --sans: "Source Sans 3", -apple-system, "Segoe UI", "PingFang SC", "Noto Sans SC", "Helvetica Neue", Arial, sans-serif;
}
/* English edition (PI 10-17 chose F2): Libre Baskerville for headings and the quote, Source Sans 3 for text; Chinese fallbacks kept */
html[lang="en"] {
  --serif: "Libre Baskerville", "Noto Serif SC", Georgia, "Times New Roman", serif;
  --sans: "Source Sans 3", -apple-system, "Segoe UI", "Helvetica Neue", Arial, "PingFang SC", "Noto Sans SC", sans-serif;
  --shadow: 0 1px 2px rgba(16,32,48,.05), 0 6px 20px -8px rgba(16,32,48,.12);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1419; --panel: #161e26; --panel2: #1b242d; --ink: #e6ecf1; --muted: #94a3b1; --line: #27323d;
    --navy: #06142b; --navy2: #0b2448; --accent: #2fd1c1; --accent-soft: #113833; --gold: #f1bd4f;
    --pi: #86a9ff; --pi-soft: #1b2640; --lead: #2fd1c1; --lead-soft: #113833; --bot: #bda4f3; --bot-soft: #2a2140;
    --rev: #f2a65f; --rev-soft: #3a2a17; --dec: #5fd38a; --dec-soft: #173322; --res: #a8b5c6; --res-soft: #232b35;
    --sys: #9ca3af; --sys-soft: #23272c; --code: #202a33;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -10px rgba(0,0,0,.6);
  }
}
* { box-sizing: border-box; }
html[lang="en"] body { font-size: 15.5px; line-height: 1.65; letter-spacing: 0; }
html[lang="en"] table.mx, html[lang="en"] .sband .v, html[lang="en"] .meta, html[lang="en"] .stat .n { font-variant-numeric: lining-nums tabular-nums; }
html[lang="en"] .hero h1 { font-weight: 600; letter-spacing: -0.015em; font-size: 50px; }
html[lang="en"] .hero h1 small { font-size: 17.5px; letter-spacing: 0; }
html[lang="en"] .quote p { font-style: italic; font-size: 20px; line-height: 1.65; }
html[lang="en"] h2.sec, html[lang="en"] .ptitle, html[lang="en"] .pcard h3 { letter-spacing: -0.01em; }
html[lang="en"] .stat .n { font-variant-numeric: lining-nums; }
html[lang="en"] .md h1, html[lang="en"] .md h2, html[lang="en"] .md h3 { font-family: var(--serif); letter-spacing: -0.005em; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15.5px/1.7 var(--sans); -webkit-font-smoothing: antialiased; }
a { color: var(--accent); }
.wrap { max-width: 1560px; margin: 0 auto; padding: 0 32px; }

/* ---------- hero ---------- */
.hero { color: #fff; background: radial-gradient(1200px 520px at 90% -10%, rgba(64,92,190,.38), transparent 60%),
        radial-gradient(900px 400px at 0% 110%, rgba(224,150,0,.16), transparent 60%),
        linear-gradient(135deg, var(--navy) 0%, var(--navy2) 100%); position: relative; overflow: hidden; }
.hero::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .35;
  background: repeating-linear-gradient(-18deg, transparent 0 46px, rgba(255,255,255,.045) 46px 47px); }
.hero .wrap { position: relative; padding: 44px 24px 26px; }
.eyebrow { font-size: 12.5px; letter-spacing: .22em; text-transform: uppercase; color: rgba(255,255,255,.72); margin-bottom: 10px; }
.hero h1 { margin: 0; font-family: var(--serif); font-weight: 600; font-size: 46px; line-height: 1.1; letter-spacing: .01em; }
.hero h1 small { display: block; font-family: var(--sans); font-weight: 400; font-size: 17px; margin-top: 10px; color: rgba(255,255,255,.85); letter-spacing: .02em; }
.authors { margin-top: 22px; display: flex; flex-wrap: wrap; gap: 8px 30px; font-size: 14.5px; }
.authors b { font-weight: 600; color: #fff; } .authors span { color: rgba(255,255,255,.7); margin-left: 6px; }
.built { margin-top: 14px; font-size: 12.5px; color: rgba(255,255,255,.6); }
nav.bar { position: sticky; top: 0; z-index: 10; background: var(--panel); border-bottom: 1px solid var(--line); box-shadow: 0 2px 10px -6px rgba(0,0,0,.25); }
nav.bar .wrap { display: flex; gap: 4px; overflow-x: auto; align-items: center; }
nav.bar .lang { margin-left: auto; border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 600; color: var(--accent); background: var(--panel); cursor: pointer; white-space: nowrap; }
.zhmark { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; margin-left: 6px; vertical-align: middle; }
nav.bar button { background: none; border: 0; border-bottom: 3px solid transparent; color: var(--muted); padding: 14px 16px 11px; font: inherit; font-size: 15px; cursor: pointer; white-space: nowrap; letter-spacing: .02em; }
nav.bar button:hover { color: var(--ink); }
nav.bar button.on { color: var(--accent); border-color: var(--accent); font-weight: 600; }
main { padding: 28px 0 40px; }

/* ---------- common ---------- */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 18px 20px; margin-bottom: 14px; min-width: 0; box-shadow: 0 1px 2px rgba(16,32,48,.05); }
.meta { color: var(--muted); font-size: 12.5px; }
/* ticket 0122: 批复与行动 (read-only) */
.acts { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; }
.acts .card { padding: 14px 16px; }
.acts h3 { margin: 0 0 8px; font-size: 15px; display: flex; gap: 8px; align-items: baseline; }
.acts ul { list-style: none; margin: 0; padding: 0; }
.acts li { padding: 7px 0; border-top: 1px solid var(--line); font-size: 14px; line-height: 1.5; }
.acts li:first-child { border-top: 0; }
.acts .aid { font-family: ui-monospace, monospace; font-size: 12px; color: var(--muted); margin-right: 6px; }
.acts .pri { font-size: 11px; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; margin-right: 6px; color: var(--muted); }
.acts .urg { color: #b42318; border-color: #f5b5ae; font-weight: 600; }
.acts li.u { color: #b42318; }
.md { overflow-wrap: anywhere; word-break: break-word; }
.md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
.md table { border-collapse: collapse; font-size: 13px; margin: 8px 0; display: block; overflow-x: auto; }
.md th, .md td { border: 1px solid var(--line); padding: 5px 9px; text-align: left; vertical-align: top; }
.md th { background: var(--panel2); }
.md pre, .md code { background: var(--code); border-radius: 5px; font-size: 12.5px; }
.md pre { padding: 10px; overflow-x: auto; }
.md blockquote { margin: 8px 0; padding: 4px 14px; border-left: 3px solid var(--accent); color: var(--muted); }
.md h1 { font-size: 19px; } .md h2 { font-size: 17px; } .md h3 { font-size: 15.5px; }
.md img { max-width: 100%; border-radius: 6px; }
.clip { max-height: 300px; overflow: hidden; position: relative; }
.clip::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 64px; background: linear-gradient(transparent, var(--panel)); }
.more { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 6px 0 0; font: inherit; font-size: 13px; font-weight: 600; }
.reftag { display: inline-block; font-size: 11px; margin-left: 6px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line, #8886); color: var(--muted); white-space: nowrap; }
.chip { display: inline-block; font-size: 12px; padding: 2px 10px; border-radius: 999px; font-weight: 600; white-space: nowrap; letter-spacing: .02em; }
.st-探索中 { background: var(--pi-soft); color: var(--pi); }
.st-搁置 { background: var(--sys-soft); color: var(--sys); }
.st-待转正 { background: var(--rev-soft); color: var(--rev); }
.st-已转正, .st-完成, .st-已完成 { background: var(--dec-soft); color: var(--dec); }
.st-待试, .st-在试 { background: var(--pi-soft); color: var(--pi); } .st-值得用 { background: var(--dec-soft); color: var(--dec); } .st-放弃 { background: var(--sys-soft); color: var(--sys); }
.st-进行中 { background: var(--lead-soft); color: var(--lead); }
h2.sec { font-family: var(--serif); font-weight: 600; font-size: 24px; margin: 34px 0 14px; padding-left: 14px; border-left: 4px solid var(--gold); line-height: 1.25; }
h2.sec .meta { font-family: var(--sans); font-weight: 400; font-size: 13px; margin-left: 12px; }
.btn { background: var(--accent-soft); color: var(--accent); border: 0; border-radius: 8px; padding: 6px 14px; font: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer; transition: background .15s; }
.btn:hover { background: var(--accent); color: var(--panel); }
.btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--ink); font-weight: 500; }
.btn.ghost:hover { border-color: var(--accent); color: var(--accent); background: transparent; }

/* ---------- home ---------- */
.intro { display: grid; grid-template-columns: 1.4fr 1fr; gap: 18px; align-items: stretch; }
.quote { position: relative; padding: 30px 32px 26px 60px; }
.quote::before { content: "“"; position: absolute; left: 20px; top: 8px; font-family: var(--serif); font-size: 84px; line-height: 1; color: var(--gold); opacity: .8; }
.quote p { font-family: var(--serif); font-size: 19px; line-height: 1.8; margin: 0 0 12px; }
.quote .by { font-size: 14px; color: var(--muted); letter-spacing: .06em; }
.quote .by b { color: var(--ink); font-weight: 600; margin-right: 6px; }
.about { display: flex; flex-direction: column; justify-content: center; }
.about .md { font-size: 14.5px; color: var(--muted); }
.about .md strong { color: var(--ink); }
.pr { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.prc { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 0; font-size: 14.5px; }
.prc .num { flex: none; width: 34px; height: 34px; border-radius: 50%; background: var(--navy); color: #fff; font-family: var(--serif); font-size: 18px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
.prc .md p { margin: 0; }
.stats { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; margin: 18px 0 8px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 16px 12px; box-shadow: var(--shadow); position: relative; overflow: hidden; }
.stat::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--accent); }
.stat .n { font-family: var(--serif); font-size: 34px; font-weight: 600; line-height: 1.05; }
.stat .l { color: var(--muted); font-size: 12.5px; margin-top: 4px; letter-spacing: .04em; }
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; }
.pcard { display: flex; flex-direction: column; gap: 8px; transition: transform .15s, box-shadow .15s; margin-bottom: 0; }
.pcard:hover { transform: translateY(-2px); box-shadow: 0 2px 4px rgba(16,32,48,.06), 0 14px 30px -12px rgba(16,32,48,.22); }
.pcard h3 { margin: 2px 0 0; font-family: var(--serif); font-size: 18px; font-weight: 600; line-height: 1.4; }
.pcard .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.pcard .concl { font-size: 14px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
.pcard .concl p { margin: 0; }
.pcard .foot { margin-top: auto; padding-top: 10px; border-top: 1px dashed var(--line); display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.pcard.lvl2 { border-left: 4px solid var(--accent-soft); }
.pcard .parent { font-size: 12px; color: var(--muted); letter-spacing: .03em; }

/* ---------- projects ---------- */
.layout { display: grid; grid-template-columns: 290px 1fr; gap: 20px; align-items: start; }
.layout > * { min-width: 0; }
.tree { position: sticky; top: 64px; padding: 10px 10px; max-height: calc(100vh - 80px); overflow-y: auto; }
.tree .gh { font-size: 11.5px; font-weight: 700; color: var(--muted); letter-spacing: .12em; text-transform: uppercase; padding: 12px 10px 6px; border-top: 1px solid var(--line); }
.tree .gh:first-child { border-top: 0; padding-top: 4px; }
.tree a { display: flex; gap: 9px; align-items: flex-start; padding: 7px 10px; border-radius: 8px; color: var(--ink); text-decoration: none; font-size: 13.5px; line-height: 1.45; }
.tree a:hover { background: var(--panel2); }
.tree a.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.tree .dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 7px; flex: none; background: var(--sys); }
.tree .dot.st-探索中 { background: var(--pi); } .tree .dot.st-进行中 { background: var(--lead); } .tree .dot.st-待转正 { background: var(--rev); } .tree .dot.st-已转正 { background: var(--dec); } .tree .dot.st-待试, .tree .dot.st-在试 { background: var(--pi); } .tree .dot.st-值得用 { background: var(--dec); } .tree .dot.st-放弃 { background: var(--sys); }
.phead { border-top: 4px solid var(--accent); }
.ptitle { font-family: var(--serif); font-size: 26px; font-weight: 600; margin: 6px 0 8px; line-height: 1.3; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--muted); margin: 6px 0 10px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.filters button { border: 1px solid var(--line); background: var(--panel); color: var(--muted); border-radius: 999px; padding: 4px 14px; font: inherit; font-size: 13px; cursor: pointer; }
.filters button.on { background: var(--accent); color: var(--panel); border-color: transparent; font-weight: 600; }
.tl { position: relative; padding-left: 26px; }
.tl::before { content: ""; position: absolute; left: 8px; top: 6px; bottom: 6px; width: 2px; background: var(--line); }
.item { position: relative; border-left: 0; }
.item::before { content: ""; position: absolute; left: -24px; top: 22px; width: 12px; height: 12px; border-radius: 50%; background: var(--sys); border: 2px solid var(--panel); box-shadow: 0 0 0 2px var(--line); }
.r-pi::before { background: var(--pi); } .r-lead::before, .r-relay::before { background: var(--lead); }
.r-bot::before { background: var(--bot); } .r-rev::before { background: var(--rev); } .r-dec::before { background: var(--dec); }
.r-res::before { background: var(--res); } .r-sys::before { background: var(--sys); }
.who { font-weight: 600; font-size: 14px; }
.c-pi { color: var(--pi); } .c-lead, .c-relay { color: var(--lead); } .c-bot { color: var(--bot); } .c-rev { color: var(--rev); }
.c-dec { color: var(--dec); } .c-res { color: var(--res); } .c-sys { color: var(--sys); }
.head { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; align-items: baseline; margin-bottom: 6px; }
.tag { font-size: 12px; padding: 1px 9px; border-radius: 6px; font-weight: 600; }
.t-bot { background: var(--bot-soft); color: var(--bot); } .t-rev { background: var(--rev-soft); color: var(--rev); }
.t-dec { background: var(--dec-soft); color: var(--dec); } .t-res { background: var(--res-soft); color: var(--res); }
.t-sys { background: var(--sys-soft); color: var(--sys); } .t-pi { background: var(--pi-soft); color: var(--pi); }
details.sub { background: var(--panel2); }
details.sub > summary { cursor: pointer; list-style: none; position: relative; padding-right: 64px; }
details.sub > summary::-webkit-details-marker { display: none; }
details.sub > summary .title { font-weight: 600; }
details.sub > summary::after { content: "展开 ▾"; position: absolute; right: 0; top: 2px; color: var(--accent); font-size: 12.5px; }
details.sub[open] > summary::after { content: "收起 ▴"; }
html[lang="en"] details.sub > summary::after { content: "Expand ▾"; }
html[lang="en"] details.sub[open] > summary::after { content: "Collapse ▴"; }
.inner { margin-top: 12px; padding-left: 12px; border-left: 2px dashed var(--line); }
.inner .msg { padding: 10px 0; border-bottom: 1px solid var(--line); }
.inner .msg:last-child { border-bottom: 0; }
.brief { border: 1px solid var(--pi); background: var(--pi-soft); }
.brief .md { color: var(--ink); }
.brief .clip::after { background: linear-gradient(transparent, var(--pi-soft)); }
.fig img { width: 100%; border-radius: 8px; background: #fff; }
.figgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; margin: 10px 0; }
.codes a { display: inline-block; margin: 2px 12px 2px 0; font-size: 13px; }
.child { background: var(--lead-soft); border-color: transparent; }
.nest { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; align-items: stretch; }
.nest .branch { display: flex; flex-direction: column; min-width: 0; }
.nest .branch > .pcard { flex: 1; }
.nest .branch.has-kids { grid-column: 1 / -1; }
.branch.has-kids > .pcard { border-top: 3px solid var(--accent); flex: none; }
.kids { margin: 12px 0 0 14px; padding-left: 18px; border-left: 2px solid var(--accent-soft); display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; position: relative; }
.kids > .branch.has-kids { grid-column: 1 / -1; }
.pcard.sk-b-todo { opacity: .92; }
.nest.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.glabel { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .06em; margin: 0 0 6px 4px; }
.hlayout { display: grid; grid-template-columns: 220px 1fr; gap: 22px; align-items: start; margin-top: 18px; }
.hlayout > * { min-width: 0; }
.gidx { position: sticky; top: 64px; padding: 10px; }
.gidx .gh { font-size: 11.5px; font-weight: 700; color: var(--muted); letter-spacing: .12em; padding: 4px 8px 8px; }
.gidx a { display: flex; justify-content: space-between; gap: 8px; padding: 7px 8px; border-radius: 8px; color: var(--ink); text-decoration: none; font-size: 13.5px; line-height: 1.4; }
.gidx a:hover { background: var(--accent-soft); color: var(--accent); }
.gidx .n { color: var(--muted); font-size: 12.5px; }
.recent { padding: 6px 14px; }
.recent a { display: grid; grid-template-columns: auto 1fr auto auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); color: var(--ink); text-decoration: none; font-size: 14px; }
.recent a:last-child { border-bottom: 0; }
.recent a:hover .t { color: var(--accent); }
.recent .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.scope { margin: -2px 0 6px; }
.sk-run.chip { background: var(--lead-soft); color: var(--lead); } .sk-todo.chip { background: var(--pi-soft); color: var(--pi); }
.sk-pause.chip { background: var(--sys-soft); color: var(--sys); } .sk-pend.chip { background: var(--rev-soft); color: var(--rev); }
.sk-done.chip { background: var(--dec-soft); color: var(--dec); }
.dot.sk-run, .sd.sk-run { background: var(--lead); } .dot.sk-todo, .sd.sk-todo { background: var(--pi); } .dot.sk-pause, .sd.sk-pause { background: var(--sys); }
.dot.sk-pend, .sd.sk-pend { background: var(--rev); } .dot.sk-done, .sd.sk-done { background: var(--dec); }
.pcard .concl { -webkit-line-clamp: 3; }
.meta { font-size: 13px; }
.tree .tnode { font-size: 12.5px; color: var(--muted); padding: 6px 10px 2px; }
.digest { border-left: 4px solid var(--lead); margin-bottom: 18px; }
.digest .md { font-size: 14.5px; }
.trl { font-size: 11.5px; margin-left: 4px; text-decoration: none; font-weight: 600; }
.child a { font-weight: 600; text-decoration: none; font-size: 15.5px; }

/* ---------- outputs ---------- */
.toc .codes a { font-size: 14px; margin: 4px 16px 4px 0; }
.ocard h3 { font-family: var(--serif); font-size: 17px; margin: 20px 0 8px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
footer { color: var(--muted); font-size: 12.5px; padding: 10px 0 40px; border-top: 1px solid var(--line); margin-top: 20px; }

/* ---------- center architecture + how it works (ticket 0120) ---------- */
.st-在做 { background: var(--lead-soft); color: var(--lead); } .st-待开工 { background: var(--pi-soft); color: var(--pi); }

/* ===== 10-27 redesign: Notre Dame official palette (onmessage.nd.edu/university-branding/colors/, checked 10-27).
   ND Blue #0c2340, Medium Blue #143865, Bright Blue #1c4f8f, Metallic Gold #ae9142 (decoration and large numerals only:
   3.0:1 on white), Bright Gold #d39f10 (on ND Blue), Sky Blues #c1cddd/#e1e8f2/#edf2f9, Warm White #f8f4ec, Green #0a843d.
   Derived for text contrast (not in the guide): muted #4b5a6e, dark gold #735f22, green #08703a. ===== */
:root {
  --bg: #edf2f9; --panel: #ffffff; --panel2: #f8f4ec; --ink: #0c2340; --muted: #4b5a6e; --line: #c1cddd;
  --navy: #0c2340; --navy2: #143865; --accent: #1c4f8f; --accent-soft: #e1e8f2; --gold: #ae9142;
  --pi: #1c4f8f; --pi-soft: #e1e8f2; --lead: #143865; --lead-soft: #edf2f9; --bot: #5a4a8a; --bot-soft: #efecf6;
  --rev: #735f22; --rev-soft: #f8f4ec; --dec: #08703a; --dec-soft: #e3f1e8; --res: #4b5a6e; --res-soft: #edf2f9;
  --sys: #4b5a6e; --sys-soft: #edf2f9; --code: #f8f4ec;
  --ok: #08703a; --part: #1c4f8f; --no: #b3261e; --open: #735f22;
  --shadow: 0 1px 2px rgba(12,35,64,.05), 0 6px 20px -10px rgba(12,35,64,.14);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #08172b; --panel: #0c2340; --panel2: #0f2a4d; --ink: #f2f5fa; --muted: #c1cddd; --line: #1f3d66;
  --navy: #08172b; --navy2: #0c2340; --accent: #9dbbe6; --accent-soft: #143865; --gold: #d39f10;
  --pi: #9dbbe6; --pi-soft: #143865; --lead: #e1e8f2; --lead-soft: #143865; --sys: #c1cddd; --sys-soft: #0f2a4d; --code: #0f2a4d;
  --ok: #7fd3a1; --part: #9dbbe6; --no: #ff9a8f; --open: #e2c56a;
} }
